services:
  mongo:  #May be unnecessary
    image: mongo:
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - gramble-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb+srv://test-user:123Hello@mangdb.akghh0j.mongodb.net/gramble?retryWrites=true&w=majority
      - SESSION_SECRET=gramble-super-secret-key
    volumes:
      - ./backend/uploads:/app/uploads  
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - gramble-net

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app                 
      - /app/node_modules               
    depends_on:
      - backend
    networks:
      - gramble-net

volumes:
  mongo-data:

networks:
  gramble-net:
    driver: bridge