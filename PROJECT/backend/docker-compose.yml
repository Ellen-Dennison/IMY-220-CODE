version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      # Pulled from your shell env or a .env file next to this compose file.
      # Do NOT hardcode your real connection string here if this file is committed.
      - MONGODB_URI=${MONGODB_URI}

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend
